<style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:19px}.edge{fill:none;stroke:#41688e;stroke-width:2;marker-end:url(#a)}</style>
<rect width="1500" height="1080" fill="white"/>
<text x="750" y="42" font-size="27" text-anchor="middle">VINMARK — ORDER STATE DIAGRAM • AS-IS</text>
<text x="750" y="78" font-size="18" text-anchor="middle">Theo các thao tác ghi orders.status trong mã nguồn hiện tại</text>
<rect x="70" y="130" width="1360" height="690" rx="16" fill="#f8fafc" stroke="#41688e" stroke-width="2"/>
<text x="750" y="170" font-size="23" text-anchor="middle">Đơn hàng tồn tại — trạng thái bao</text>
<text x="750" y="203" font-size="17" text-anchor="middle">Hai chuyển từ BIÊN KHUNG áp dụng cho mọi trạng thái hiện tại của đơn</text>
<path d="M70 225H1430" stroke="#41688e" fill="none"/>
<rect x="210" y="330" width="280" height="115" rx="16" fill="#edf4fc" stroke="#41688e" stroke-width="2"/>
<text x="350" y="375" font-size="25" text-anchor="middle">pending</text>
<text x="350" y="412" font-size="19" text-anchor="middle">Chờ xử lý</text>
<rect x="990" y="330" width="280" height="115" rx="16" fill="#edf4fc" stroke="#41688e" stroke-width="2"/>
<text x="1130" y="375" font-size="25" text-anchor="middle">processing</text>
<text x="1130" y="412" font-size="19" text-anchor="middle">Đang xử lý</text>
<rect x="210" y="625" width="280" height="115" rx="16" fill="#edf4fc" stroke="#41688e" stroke-width="2"/>
<text x="350" y="670" font-size="25" text-anchor="middle">canceled</text>
<text x="350" y="707" font-size="19" text-anchor="middle">Khách đã hủy</text>
<rect x="990" y="625" width="280" height="115" rx="16" fill="#edf4fc" stroke="#41688e" stroke-width="2"/>
<text x="1130" y="670" font-size="25" text-anchor="middle">cancelled</text>
<text x="1130" y="707" font-size="19" text-anchor="middle">Admin đã hủy</text>
<circle cx="135" cy="387" r="11" fill="#172b4d"/>
<polyline points="146,387 210,387" class="edge"/>
<text x="350" y="275" font-size="19" text-anchor="middle">Tạo và lưu Order</text>
<text x="350" y="302" font-size="17" text-anchor="middle">COD / PayPal / MoMo return</text>
<polyline points="350,445 350,625" class="edge"/>
<text x="555" y="500" font-size="19" text-anchor="middle">Khách hủy [đúng chủ, pending]</text>
<text x="555" y="530" font-size="17" text-anchor="middle">/ hoàn kho → ghi canceled</text>
<polyline points="1430,387 1270,387" class="edge"/>
<text x="1120" y="275" font-size="18" text-anchor="middle">Admin xác nhận [ID tồn tại, có quyền]</text>
<text x="1120" y="302" font-size="16" text-anchor="middle">/ ghi processing; không kiểm tra trạng thái nguồn</text>
<polyline points="1430,682 1270,682" class="edge"/>
<text x="1120" y="560" font-size="18" text-anchor="middle">Admin hủy [ID tồn tại, có quyền]</text>
<text x="1120" y="587" font-size="16" text-anchor="middle">/ hoàn kho → ghi cancelled; không chặn hủy lặp</text>
<text x="760" y="760" font-size="18" text-anchor="middle">Chưa có final state được bảo vệ: endpoint admin vẫn có thể ghi đè trạng thái hủy.</text>
<rect x="70" y="860" width="1360" height="160" rx="16" fill="#fff8e8" stroke="#41688e" stroke-width="2"/>
<text x="750" y="895" font-size="22" text-anchor="middle">Ghi chú đối chiếu source</text>
<text x="750" y="930" font-size="18" text-anchor="middle">shipped / completed: có tham chiếu dữ liệu nhưng chưa có handler chuyển Order tới các trạng thái này.</text>
<text x="750" y="960" font-size="18" text-anchor="middle">Payment.status độc lập; thanh toán completed không đồng nghĩa Order completed.</text>
<text x="750" y="990" font-size="18" text-anchor="middle">Không bổ sung giao vận, thu COD, hoàn tiền hoặc chuyển trạng thái mục tiêu vào sơ đồ As-Is.</text>
<text x="750" y="1055" font-size="16" text-anchor="middle">18/11/2026 • Order State Diagram AS-IS theo mã nguồn</text>
