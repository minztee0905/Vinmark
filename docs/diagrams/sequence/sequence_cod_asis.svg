<style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:16px}.msg{fill:none;stroke:#385a7c;stroke-width:1.6;marker-end:url(#arrow)}.label{paint-order:stroke;stroke:white;stroke-width:4;stroke-linejoin:round}</style>
<rect width="1400" height="4261" fill="white"/>
<text x="700.0" y="38" text-anchor="middle" font-size="26" class="">SEQUENCE — ĐẶT HÀNG COD • AS-IS</text>
<text x="700.0" y="75" text-anchor="middle" font-size="16" class="">AS-IS • Đường đứt: phản hồi • alt: nhánh loại trừ • loop: lặp tuần tự • Đọc từ trên xuống</text>
<rect x="70" y="105" width="220" height="75" rx="8" fill="#edf4fc" stroke="#41688e"/>
<text x="180" y="134" text-anchor="middle" font-size="16" class="">Khách hàng</text>
<text x="180" y="171" text-anchor="middle" font-size="12" class="">actor</text>
<path d="M180 180V4206" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="330" y="105" width="220" height="75" rx="8" fill="#edf4fc" stroke="#41688e"/>
<text x="440" y="134" text-anchor="middle" font-size="16" class="">Trình duyệt / JavaScript</text>
<text x="440" y="171" text-anchor="middle" font-size="12" class="">boundary</text>
<path d="M440 180V4206" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="590" y="105" width="220" height="75" rx="8" fill="#edf4fc" stroke="#41688e"/>
<text x="700" y="134" text-anchor="middle" font-size="16" class="">Laravel web middleware</text>
<text x="700" y="171" text-anchor="middle" font-size="12" class="">control</text>
<path d="M700 180V4206" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="850" y="105" width="220" height="75" rx="8" fill="#edf4fc" stroke="#41688e"/>
<text x="960" y="134" text-anchor="middle" font-size="16" class="">CheckoutController</text>
<text x="960" y="171" text-anchor="middle" font-size="12" class="">control</text>
<path d="M960 180V4206" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="1110" y="105" width="220" height="75" rx="8" fill="#edf4fc" stroke="#41688e"/>
<text x="1220" y="134" text-anchor="middle" font-size="16" class="">CSDL qua Eloquent / DB</text>
<text x="1220" y="171" text-anchor="middle" font-size="12" class="">database</text>
<path d="M1220 180V4206" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="42" y="387" width="1316" height="3751" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="42" y="387" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="80" y="408" text-anchor="middle" font-size="16" class="">alt</text>
<text x="132" y="410" text-anchor="start" font-size="15" class="label">[Chưa có phiên guard web]</text>
<path d="M42 524H1358" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="551" text-anchor="start" font-size="15" class="label">[Có phiên guard web]</text>
<rect x="59" y="799" width="1282" height="3304" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="59" y="799" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="97" y="820" text-anchor="middle" font-size="16" class="">alt</text>
<text x="149" y="822" text-anchor="start" font-size="15" class="label">[Không có địa chỉ mặc định]</text>
<path d="M59 915H1341" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="79" y="942" text-anchor="start" font-size="15" class="label">[Có địa chỉ mặc định]</text>
<rect x="76" y="1463" width="1248" height="2605" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="76" y="1463" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="114" y="1484" text-anchor="middle" font-size="16" class="">alt</text>
<text x="166" y="1486" text-anchor="start" font-size="15" class="label">[CSRF không hợp lệ hoặc thiếu phiên guard web]</text>
<path d="M76 1600H1324" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="96" y="1627" text-anchor="start" font-size="15" class="label">[Request qua được middleware]</text>
<rect x="93" y="1972" width="1214" height="2061" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="93" y="1972" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="131" y="1993" text-anchor="middle" font-size="16" class="">alt</text>
<text x="183" y="1995" text-anchor="start" font-size="15" class="label">[Validation thất bại]</text>
<path d="M93 2088H1307" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="113" y="2115" text-anchor="start" font-size="15" class="label">[Dữ liệu hợp lệ]</text>
<rect x="110" y="2307" width="1180" height="1691" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="110" y="2307" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="148" y="2328" text-anchor="middle" font-size="16" class="">alt</text>
<text x="200" y="2330" text-anchor="start" font-size="15" class="label">[Giỏ rỗng]</text>
<path d="M110 2423H1290" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="130" y="2450" text-anchor="start" font-size="15" class="label">[Giỏ không rỗng]</text>
<rect x="127" y="2565" width="1146" height="1398" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="127" y="2565" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="165" y="2586" text-anchor="middle" font-size="16" class="">alt</text>
<text x="217" y="2588" text-anchor="start" font-size="15" class="label">[Khối try thực hiện thành công]</text>
<path d="M127 3602H1273" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="147" y="3629" text-anchor="start" font-size="15" class="label">[Exception phát sinh ở bất kỳ bước nào trong try]</text>
<rect x="144" y="2897" width="1112" height="416" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="144" y="2897" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="182" y="2918" text-anchor="middle" font-size="16" class="">loop</text>
<text x="234" y="2920" text-anchor="start" font-size="15" class="label">[foreach cartItems, tuần tự]</text>
<rect x="30" y="210" width="1340" height="42" fill="#e8eff7" stroke="#94a3b8"/>
<text x="700.0" y="237" text-anchor="middle" font-size="19" class="">A. Mở checkout</text>
<path d="M180 302H440" class="msg"/>
<text x="310.0" y="293" text-anchor="middle" font-size="16" class="label">1. Mở trang checkout</text>
<path d="M440 358H700" class="msg"/>
<text x="570.0" y="349" text-anchor="middle" font-size="16" class="label">2. GET /checkout</text>
<path d="M700 495H440" class="msg" stroke-dasharray="6 4"/>
<text x="570.0" y="465" text-anchor="middle" font-size="16" class="label">3. Toast yêu cầu đăng nhập;</text>
<text x="570.0" y="486" text-anchor="middle" font-size="16" class="label">redirect /login</text>
<path d="M700 616H960" class="msg"/>
<text x="830.0" y="607" text-anchor="middle" font-size="16" class="label">4. index()</text>
<path d="M960 693H1220" class="msg"/>
<text x="1090.0" y="663" text-anchor="middle" font-size="16" class="label">5. Nạp địa chỉ của user; tìm</text>
<text x="1090.0" y="684" text-anchor="middle" font-size="16" class="label">default=true</text>
<path d="M1220 770H960" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="740" text-anchor="middle" font-size="16" class="label">6. Danh sách và địa chỉ mặc</text>
<text x="1090.0" y="761" text-anchor="middle" font-size="16" class="label">định</text>
<path d="M960 886H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="877" text-anchor="middle" font-size="16" class="label">7. Toast thêm địa chỉ; redirect /account</text>
<path d="M960 1028H1220" class="msg"/>
<text x="1090.0" y="998" text-anchor="middle" font-size="16" class="label">8. Nạp giỏ cùng product; tính</text>
<text x="1090.0" y="1019" text-anchor="middle" font-size="16" class="label">Σ(quantity × price)</text>
<path d="M1220 1084H960" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="1075" text-anchor="middle" font-size="16" class="label">9. Dữ liệu giỏ</text>
<path d="M960 1140H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="1131" text-anchor="middle" font-size="16" class="label">10. Render checkout: tổng hiển thị = tiền hàng + 25.000đ</text>
<rect x="85" y="1169" width="1230" height="74" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="700.0" y="1193" text-anchor="middle" font-size="16" class="">GET checkout không chặn giỏ rỗng hoặc thiếu tồn. Dropdown đổi địa chỉ qua AJAX chỉ cập nhật thông tin hiển thị; hidden address_id của form COD vẫn là</text>
<text x="700.0" y="1214" text-anchor="middle" font-size="16" class="">địa chỉ mặc định lúc render.</text>
<rect x="30" y="1265" width="1340" height="42" fill="#e8eff7" stroke="#94a3b8"/>
<text x="700.0" y="1292" text-anchor="middle" font-size="19" class="">B. Gửi đơn COD</text>
<path d="M180 1357H440" class="msg"/>
<text x="310.0" y="1348" text-anchor="middle" font-size="16" class="label">11. Chọn COD và bấm Đặt hàng</text>
<path d="M440 1434H700" class="msg"/>
<text x="570.0" y="1404" text-anchor="middle" font-size="16" class="label">12. POST /checkout</text>
<text x="570.0" y="1425" text-anchor="middle" font-size="16" class="label">[placeOrder] + CSRF</text>
<path d="M700 1571H440" class="msg" stroke-dasharray="6 4"/>
<text x="570.0" y="1541" text-anchor="middle" font-size="16" class="label">13. 419 CSRF hoặc redirect</text>
<text x="570.0" y="1562" text-anchor="middle" font-size="16" class="label">/login (trước controller)</text>
<path d="M700 1713H960" class="msg"/>
<text x="830.0" y="1683" text-anchor="middle" font-size="16" class="label">14. /checkout [placeOrder] →</text>
<text x="830.0" y="1704" text-anchor="middle" font-size="16" class="label">phương thức controller</text>
<path d="M960 1790h42v20h-42" class="msg"/>
<text x="1015" y="1760" text-anchor="start" font-size="16" class="label">15. Validate required / kiểu dữ</text>
<text x="1015" y="1781" text-anchor="start" font-size="16" class="label">liệu; address_id phải tồn tại</text>
<path d="M960 1887H1220" class="msg"/>
<text x="1090.0" y="1857" text-anchor="middle" font-size="16" class="label">16. Kiểm tra address_id tồn</text>
<text x="1090.0" y="1878" text-anchor="middle" font-size="16" class="label">tại</text>
<path d="M1220 1943H960" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="1934" text-anchor="middle" font-size="16" class="label">17. Kết quả tồn tại địa chỉ</text>
<path d="M960 2059H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="2050" text-anchor="middle" font-size="16" class="label">18. Laravel trả lỗi validation (form redirect / JSON 422)</text>
<path d="M960 2201H1220" class="msg"/>
<text x="1090.0" y="2171" text-anchor="middle" font-size="16" class="label">19. Nạp CartItem theo Auth</text>
<text x="1090.0" y="2192" text-anchor="middle" font-size="16" class="label">user cùng product</text>
<path d="M1220 2278H960" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="2248" text-anchor="middle" font-size="16" class="label">20. Các dòng giỏ và sản phẩm</text>
<text x="1090.0" y="2269" text-anchor="middle" font-size="16" class="label">hiện tại</text>
<path d="M960 2394H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="2385" text-anchor="middle" font-size="16" class="label">21. Toast giỏ trống; redirect /cart</text>
<path d="M960 2536H1220" class="msg"/>
<text x="1090.0" y="2506" text-anchor="middle" font-size="16" class="label">22. DB::beginTransaction() —</text>
<text x="1090.0" y="2527" text-anchor="middle" font-size="16" class="label">nằm ngoài try</text>
<path d="M960 2673h42v20h-42" class="msg"/>
<text x="1015" y="2643" text-anchor="start" font-size="16" class="label">23. Tính tổng = Σ(quantity ×</text>
<text x="1015" y="2664" text-anchor="start" font-size="16" class="label">product.price); không cộng ship</text>
<path d="M960 2791H1220" class="msg"/>
<text x="1090.0" y="2740" text-anchor="middle" font-size="16" class="label">24. Tạo Order: user,</text>
<text x="1090.0" y="2761" text-anchor="middle" font-size="16" class="label">address_id, total_price,</text>
<text x="1090.0" y="2782" text-anchor="middle" font-size="16" class="label">status=pending</text>
<path d="M1220 2868H960" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="2838" text-anchor="middle" font-size="16" class="label">25. Order đã lưu trong</text>
<text x="1090.0" y="2859" text-anchor="middle" font-size="16" class="label">transaction</text>
<path d="M960 3026H1220" class="msg"/>
<text x="1090.0" y="2975" text-anchor="middle" font-size="16" class="label">26. Tạo OrderItem: order,</text>
<text x="1090.0" y="2996" text-anchor="middle" font-size="16" class="label">product, quantity, giá hiện</text>
<text x="1090.0" y="3017" text-anchor="middle" font-size="16" class="label">tại</text>
<path d="M960 3103h42v20h-42" class="msg"/>
<text x="1015" y="3073" text-anchor="start" font-size="16" class="label">27. Kiểm tra stock &lt; quantity; nếu</text>
<text x="1015" y="3094" text-anchor="start" font-size="16" class="label">thiếu thì throw Exception</text>
<rect x="85" y="3152" width="1230" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="700.0" y="3176" text-anchor="middle" font-size="16" class="">Tạo OrderItem TRƯỚC kiểm tra tồn. Nếu throw Exception ở đây, dừng khối try và chạy nhánh catch bên dưới; không tiếp tục tạo Payment.</text>
<path d="M960 3272H1220" class="msg"/>
<text x="1090.0" y="3242" text-anchor="middle" font-size="16" class="label">28. decrement stock theo</text>
<text x="1090.0" y="3263" text-anchor="middle" font-size="16" class="label">quantity — khi không thiếu tồn</text>
<path d="M960 3384H1220" class="msg"/>
<text x="1090.0" y="3354" text-anchor="middle" font-size="16" class="label">29. Tạo Payment cash/pending;</text>
<text x="1090.0" y="3375" text-anchor="middle" font-size="16" class="label">amount=tổng đơn; paid_at=null</text>
<path d="M960 3461H1220" class="msg"/>
<text x="1090.0" y="3431" text-anchor="middle" font-size="16" class="label">30. Xóa toàn bộ CartItem theo</text>
<text x="1090.0" y="3452" text-anchor="middle" font-size="16" class="label">user_id</text>
<path d="M960 3517H1220" class="msg"/>
<text x="1090.0" y="3508" text-anchor="middle" font-size="16" class="label">31. DB::commit()</text>
<path d="M960 3573H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="3564" text-anchor="middle" font-size="16" class="label">32. Toast thành công; redirect /account</text>
<path d="M960 3694h42v20h-42" class="msg"/>
<text x="1015" y="3685" text-anchor="start" font-size="16" class="label">33. Log::error thông điệp lỗi</text>
<path d="M960 3770H1220" class="msg"/>
<text x="1090.0" y="3761" text-anchor="middle" font-size="16" class="label">34. DB::rollBack()</text>
<path d="M960 3826H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="3817" text-anchor="middle" font-size="16" class="label">35. Toast lỗi; redirect /checkout</text>
<rect x="85" y="3855" width="1230" height="74" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="700.0" y="3879" text-anchor="middle" font-size="16" class="">Nhánh catch thay thế phần còn lại sau bước ném Exception, không chạy sau một luồng thành công. PHP Error không được catch(Exception) này bắt. Rollback</text>
<text x="700.0" y="3900" text-anchor="middle" font-size="16" class="">không hoàn tác được dữ liệu đã commit nếu lỗi xảy ra sau commit.</text>
<text x="700.0" y="4241" text-anchor="middle" font-size="15" class="">Vinmark • Sơ đồ tương tác AS-IS theo mã nguồn • Không bổ sung bước To-Be</text>
</svg>