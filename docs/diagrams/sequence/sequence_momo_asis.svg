<path d="M42 714H1618" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="741" text-anchor="start" font-size="15" class="label">[Request qua được middleware]</text>
<rect x="59" y="1086" width="1542" height="864" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="59" y="1086" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="97" y="1107" text-anchor="middle" font-size="16" class="">alt</text>
<text x="149" y="1109" text-anchor="start" font-size="15" class="label">[Validation thất bại]</text>
<path d="M59 1202H1601" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="79" y="1229" text-anchor="start" font-size="15" class="label">[Dữ liệu hợp lệ]</text>
<rect x="76" y="1666" width="1508" height="249" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="76" y="1666" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="114" y="1687" text-anchor="middle" font-size="16" class="">alt</text>
<text x="166" y="1689" text-anchor="start" font-size="15" class="label">[Response có payUrl]</text>
<path d="M76 1782H1584" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="96" y="1809" text-anchor="start" font-size="15" class="label">[Response không có payUrl]</text>
<rect x="42" y="2008" width="1576" height="326" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="42" y="2008" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="80" y="2029" text-anchor="middle" font-size="16" class="">alt</text>
<text x="132" y="2031" text-anchor="start" font-size="15" class="label">[Frontend nhận data.payUrl]</text>
<path d="M42 2180H1618" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="2207" text-anchor="start" font-size="15" class="label">[Frontend không nhận payUrl hoặc fetch/JSON lỗi]</text>
<rect x="42" y="2627" width="1576" height="1329" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="42" y="2627" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="80" y="2648" text-anchor="middle" font-size="16" class="">alt</text>
<text x="132" y="2650" text-anchor="start" font-size="15" class="label">[Thiếu phiên guard web]</text>
<path d="M42 2764H1618" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="2791" text-anchor="start" font-size="15" class="label">[Có phiên guard web]</text>
<rect x="59" y="2885" width="1542" height="1036" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="59" y="2885" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="97" y="2906" text-anchor="middle" font-size="16" class="">alt</text>
<text x="149" y="2908" text-anchor="start" font-size="15" class="label">[$request-&gt;resultCode == 0 (so sánh lỏng)]</text>
<path d="M59 3788H1601" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="79" y="3815" text-anchor="start" font-size="15" class="label">[resultCode không bằng 0]</text>
<rect x="76" y="3504" width="1508" height="149" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="76" y="3504" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="114" y="3525" text-anchor="middle" font-size="16" class="">loop</text>
<text x="166" y="3527" text-anchor="start" font-size="15" class="label">[foreach giỏ hiện tại]</text>
<rect x="42" y="4196" width="1576" height="523" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="42" y="4196" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="80" y="4217" text-anchor="middle" font-size="16" class="">alt</text>
<text x="132" y="4219" text-anchor="start" font-size="15" class="label">[CSRF không hợp lệ khi middleware đang áp dụng]</text>
<path d="M42 4312H1618" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="4339" text-anchor="start" font-size="15" class="label">[CSRF hợp lệ nhưng thiếu phiên guard web]</text>
<path d="M42 4433H1618" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="4460" text-anchor="start" font-size="15" class="label">[Request qua được CSRF và auth.custom]</text>
<rect x="85" y="210" width="1490" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="234" text-anchor="middle" font-size="16" class="">Bắt đầu khi checkout đã render: có phiên web và địa chỉ mặc định. SDK/JS phải tải để handler MoMo được đăng ký. Redirect return và IPN là hai request độc lập.</text>
<rect x="30" y="282" width="1600" height="42" fill="#e8eff7" stroke="#94a3b8"/>
<text x="830.0" y="309" text-anchor="middle" font-size="19" class="">A. Khởi tạo thanh toán</text>
<path d="M180 374H440" class="msg"/>
<text x="310.0" y="365" text-anchor="middle" font-size="16" class="label">1. Chọn MoMo và bấm Đặt hàng</text>
<path d="M440 451h42v20h-42" class="msg"/>
<text x="495" y="421" text-anchor="start" font-size="16" class="label">2. preventDefault; đọc amount DOM và</text>
<text x="495" y="442" text-anchor="start" font-size="16" class="label">địa chỉ dropdown</text>
<path d="M440 548H700" class="msg"/>
<text x="570.0" y="518" text-anchor="middle" font-size="16" class="label">3. POST /checkout/momo</text>
<text x="570.0" y="539" text-anchor="middle" font-size="16" class="label">[placeOrderMoMo] + CSRF</text>
<path d="M700 685H440" class="msg" stroke-dasharray="6 4"/>
<text x="570.0" y="655" text-anchor="middle" font-size="16" class="label">4. 419 CSRF hoặc redirect</text>
<text x="570.0" y="676" text-anchor="middle" font-size="16" class="label">/login (trước controller)</text>
<path d="M700 848H960" class="msg"/>
<text x="830.0" y="797" text-anchor="middle" font-size="16" class="label">5. /checkout/momo</text>
<text x="830.0" y="818" text-anchor="middle" font-size="16" class="label">[placeOrderMoMo] → phương thức</text>
<text x="830.0" y="839" text-anchor="middle" font-size="16" class="label">controller</text>
<path d="M960 925h42v20h-42" class="msg"/>
<text x="1015" y="895" text-anchor="start" font-size="16" class="label">6. Validate required / kiểu dữ liệu;</text>
<text x="1015" y="916" text-anchor="start" font-size="16" class="label">address_id phải tồn tại</text>
<path d="M960 1001H1220" class="msg"/>
<text x="1090.0" y="992" text-anchor="middle" font-size="16" class="label">7. Kiểm tra address_id tồn tại</text>
<path d="M1220 1057H960" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="1048" text-anchor="middle" font-size="16" class="label">8. Kết quả tồn tại địa chỉ</text>
<path d="M960 1173H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="1164" text-anchor="middle" font-size="16" class="label">9. Laravel trả lỗi validation (form redirect / JSON 422)</text>
<rect x="85" y="1267" width="1490" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="1291" text-anchor="middle" font-size="16" class="">Validation amount: numeric, min 1.000; address phải tồn tại. Chưa kiểm tra giỏ rỗng, tồn hoặc chủ địa chỉ.</text>
<path d="M960 1408h42v20h-42" class="msg"/>
<text x="1015" y="1357" text-anchor="start" font-size="16" class="label">10. Lấy amount request; tạo</text>
<text x="1015" y="1378" text-anchor="start" font-size="16" class="label">orderId/requestId=time(); ký HMAC</text>
<text x="1015" y="1399" text-anchor="start" font-size="16" class="label">request gửi đi</text>
<path d="M960 1505h42v20h-42" class="msg"/>
<text x="1015" y="1475" text-anchor="start" font-size="16" class="label">11. Lưu address_id và total_price</text>
<text x="1015" y="1496" text-anchor="start" font-size="16" class="label">vào session</text>
<path d="M960 1581H1480" class="msg"/>
<text x="1220.0" y="1572" text-anchor="middle" font-size="16" class="label">12. HTTP POST /v2/gateway/api/create (endpoint thử nghiệm)</text>
<path d="M1480 1637H960" class="msg" stroke-dasharray="6 4"/>
<text x="1220.0" y="1628" text-anchor="middle" font-size="16" class="label">13. JSON response</text>
<path d="M960 1753H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="1744" text-anchor="middle" font-size="16" class="label">14. JSON payUrl</text>
<path d="M960 1874H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="1865" text-anchor="middle" font-size="16" class="label">15. JSON success=false + message + response</text>
<path d="M440 2095H1480" class="msg"/>
<text x="960.0" y="2086" text-anchor="middle" font-size="16" class="label">16. window.location.href = payUrl</text>
<path d="M180 2151H1480" class="msg"/>
<text x="830.0" y="2142" text-anchor="middle" font-size="16" class="label">17. Thực hiện hoặc hủy thanh toán tại cổng</text>
<path d="M440 2293H180" class="msg" stroke-dasharray="6 4"/>
<text x="310.0" y="2263" text-anchor="middle" font-size="16" class="label">18. Toast lỗi khởi tạo / kết</text>
<text x="310.0" y="2284" text-anchor="middle" font-size="16" class="label">nối; chưa chuyển cổng</text>
<rect x="85" y="2357" width="1490" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="2381" text-anchor="middle" font-size="16" class="">Khởi tạo không tạo Order/Payment, không mở transaction. Controller không có try/catch riêng quanh HTTP call; không bổ sung handler timeout hoặc đối soát.</text>
<rect x="30" y="2429" width="1600" height="42" fill="#e8eff7" stroke="#94a3b8"/>
<text x="830.0" y="2456" text-anchor="middle" font-size="19" class="">B. Redirect return — chỉ khi trình duyệt quay về</text>
<path d="M1480 2521H440" class="msg" stroke-dasharray="6 4"/>
<text x="960.0" y="2512" text-anchor="middle" font-size="16" class="label">19. Redirect tới return URL với query kết quả</text>
<path d="M440 2598H700" class="msg"/>
<text x="570.0" y="2568" text-anchor="middle" font-size="16" class="label">20. GET /checkout/momo/return?</text>
<text x="570.0" y="2589" text-anchor="middle" font-size="16" class="label">resultCode=...&amp;transId=...</text>
<path d="M700 2735H440" class="msg" stroke-dasharray="6 4"/>
<text x="570.0" y="2705" text-anchor="middle" font-size="16" class="label">21. Redirect /login; không</text>
<text x="570.0" y="2726" text-anchor="middle" font-size="16" class="label">chạy momoReturn</text>
<path d="M700 2856H960" class="msg"/>
<text x="830.0" y="2847" text-anchor="middle" font-size="16" class="label">22. momoReturn(request)</text>
<path d="M960 2993H1220" class="msg"/>
<text x="1090.0" y="2963" text-anchor="middle" font-size="16" class="label">23. Nạp giỏ hiện tại cùng</text>
<text x="1090.0" y="2984" text-anchor="middle" font-size="16" class="label">product</text>
<path d="M1220 3049H960" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="3040" text-anchor="middle" font-size="16" class="label">24. Các dòng giỏ hiện tại</text>
<path d="M960 3126h42v20h-42" class="msg"/>
<text x="1015" y="3096" text-anchor="start" font-size="16" class="label">25. Tính totalPrice từ giỏ nhưng</text>
<text x="1015" y="3117" text-anchor="start" font-size="16" class="label">không sử dụng tổng đó</text>
<path d="M960 3223H1220" class="msg"/>
<text x="1090.0" y="3193" text-anchor="middle" font-size="16" class="label">26. Tạo Order pending; địa chỉ</text>
<text x="1090.0" y="3214" text-anchor="middle" font-size="16" class="label">và tổng lấy từ session</text>
<path d="M960 3342H1220" class="msg"/>
<text x="1090.0" y="3270" text-anchor="middle" font-size="16" class="label">27. Tạo Payment</text>
<text x="1090.0" y="3291" text-anchor="middle" font-size="16" class="label">momo/completed; paid_at=now;</text>
<text x="1090.0" y="3312" text-anchor="middle" font-size="16" class="label">transaction_id=transId hoặc</text>
<text x="1090.0" y="3333" text-anchor="middle" font-size="16" class="label">null</text>
<path d="M960 3398H1220" class="msg"/>
<text x="1090.0" y="3389" text-anchor="middle" font-size="16" class="label">28. Nạp lại CartItem theo user</text>
<path d="M1220 3475H960" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="3445" text-anchor="middle" font-size="16" class="label">29. Các dòng giỏ để tạo</text>
<text x="1090.0" y="3466" text-anchor="middle" font-size="16" class="label">OrderItem</text>
<path d="M960 3612H1220" class="msg"/>
<text x="1090.0" y="3582" text-anchor="middle" font-size="16" class="label">30. Tạo OrderItem với quantity</text>
<text x="1090.0" y="3603" text-anchor="middle" font-size="16" class="label">và giá product hiện tại</text>
<path d="M960 3703H1220" class="msg"/>
<text x="1090.0" y="3694" text-anchor="middle" font-size="16" class="label">31. Xóa toàn bộ giỏ của user</text>
<path d="M960 3759H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="3750" text-anchor="middle" font-size="16" class="label">32. Toast MoMo thành công; redirect /account</text>
<path d="M960 3880H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="3871" text-anchor="middle" font-size="16" class="label">33. Toast thất bại / bị hủy; redirect /checkout</text>
<rect x="85" y="3979" width="1490" height="74" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="4003" text-anchor="middle" font-size="16" class="">Return không verify chữ ký/tiền, không chặn giỏ rỗng, không kiểm tra hoặc trừ tồn, không transaction/catch/rollback. Lỗi giữa chừng có thể để lại bản ghi một phần; tải lại return có thể</text>
<text x="830.0" y="4024" text-anchor="middle" font-size="16" class="">tạo thêm đơn. Ký request gửi đi không phải xác minh callback.</text>
<rect x="30" y="4075" width="1600" height="42" fill="#e8eff7" stroke="#94a3b8"/>
<text x="830.0" y="4102" text-anchor="middle" font-size="19" class="">C. IPN độc lập — có thể đến trước/sau hoặc không có redirect</text>
<path d="M1480 4167H700" class="msg"/>
<text x="1090.0" y="4158" text-anchor="middle" font-size="16" class="label">34. POST /checkout/momo/notify (IPN)</text>
<path d="M700 4283H1480" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="4274" text-anchor="middle" font-size="16" class="label">35. Framework từ chối, thường HTTP 419</text>
<path d="M700 4404H1480" class="msg" stroke-dasharray="6 4"/>
<text x="1090.0" y="4395" text-anchor="middle" font-size="16" class="label">36. Redirect /login; không vào momoNotify</text>
<path d="M700 4525H960" class="msg"/>
<text x="830.0" y="4516" text-anchor="middle" font-size="16" class="label">37. momoNotify(request)</text>
<path d="M960 4602h42v20h-42" class="msg"/>
<text x="1015" y="4572" text-anchor="start" font-size="16" class="label">38. Log::info MoMo IPN: toàn bộ</text>
<text x="1015" y="4593" text-anchor="start" font-size="16" class="label">request</text>
<path d="M960 4678H1480" class="msg" stroke-dasharray="6 4"/>
<text x="1220.0" y="4669" text-anchor="middle" font-size="16" class="label">39. OK, HTTP 200</text>
<rect x="85" y="4742" width="1490" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="4766" text-anchor="middle" font-size="16" class="">IPN không cập nhật Order, Payment hay tồn kho. Phần C là một tương tác riêng, không phải bước xảy ra bắt buộc sau phần B; không có thứ tự bắt buộc giữa return và IPN.</text>
<text x="830.0" y="4894" text-anchor="middle" font-size="15" class="">Vinmark • Sơ đồ tương tác AS-IS theo mã nguồn • Không bổ sung bước To-Be</text>
</svg>