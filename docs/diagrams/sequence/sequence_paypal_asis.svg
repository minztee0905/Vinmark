<text x="700" y="134" text-anchor="middle" font-size="16" class="">PayPal / SDK</text>
<text x="700" y="171" text-anchor="middle" font-size="12" class="">participant</text>
<path d="M700 180V4323" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="850" y="105" width="220" height="75" rx="8" fill="#edf4fc" stroke="#41688e"/>
<text x="960" y="134" text-anchor="middle" font-size="16" class="">Laravel web middleware</text>
<text x="960" y="171" text-anchor="middle" font-size="12" class="">control</text>
<path d="M960 180V4323" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="1110" y="105" width="220" height="75" rx="8" fill="#edf4fc" stroke="#41688e"/>
<text x="1220" y="134" text-anchor="middle" font-size="16" class="">CheckoutController</text>
<text x="1220" y="171" text-anchor="middle" font-size="12" class="">control</text>
<path d="M1220 180V4323" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="1370" y="105" width="220" height="75" rx="8" fill="#edf4fc" stroke="#41688e"/>
<text x="1480" y="134" text-anchor="middle" font-size="16" class="">CSDL qua Eloquent / DB</text>
<text x="1480" y="171" text-anchor="middle" font-size="12" class="">database</text>
<path d="M1480 180V4323" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="42" y="1081" width="1576" height="2647" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="42" y="1081" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="80" y="1102" text-anchor="middle" font-size="16" class="">alt</text>
<text x="132" y="1104" text-anchor="start" font-size="15" class="label">[CSRF không hợp lệ hoặc thiếu phiên guard web]</text>
<path d="M42 1197H1618" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="1224" text-anchor="start" font-size="15" class="label">[Request qua được middleware]</text>
<rect x="59" y="1590" width="1542" height="2103" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="59" y="1590" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="97" y="1611" text-anchor="middle" font-size="16" class="">alt</text>
<text x="149" y="1613" text-anchor="start" font-size="15" class="label">[Validation thất bại]</text>
<path d="M59 1706H1601" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="79" y="1733" text-anchor="start" font-size="15" class="label">[Dữ liệu hợp lệ]</text>
<rect x="76" y="1925" width="1508" height="1733" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="76" y="1925" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="114" y="1946" text-anchor="middle" font-size="16" class="">alt</text>
<text x="166" y="1948" text-anchor="start" font-size="15" class="label">[Giỏ rỗng]</text>
<path d="M76 2041H1584" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="96" y="2068" text-anchor="start" font-size="15" class="label">[Giỏ không rỗng]</text>
<rect x="93" y="2183" width="1474" height="1440" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="93" y="2183" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="131" y="2204" text-anchor="middle" font-size="16" class="">alt</text>
<text x="183" y="2206" text-anchor="start" font-size="15" class="label">[Khối try thực hiện thành công]</text>
<path d="M93 3262H1567" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="113" y="3289" text-anchor="start" font-size="15" class="label">[Exception phát sinh ở bất kỳ bước nào trong try]</text>
<rect x="110" y="2515" width="1440" height="416" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="110" y="2515" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="148" y="2536" text-anchor="middle" font-size="16" class="">loop</text>
<text x="200" y="2538" text-anchor="start" font-size="15" class="label">[foreach cartItems, tuần tự]</text>
<rect x="42" y="3751" width="1576" height="432" fill="none" stroke="#64748b" stroke-width="1.4"/>
<rect x="42" y="3751" width="75" height="30" fill="#e2e8f0" stroke="#64748b"/>
<text x="80" y="3772" text-anchor="middle" font-size="16" class="">alt</text>
<text x="132" y="3774" text-anchor="start" font-size="15" class="label">[Fetch đã đọc JSON và data.success=true]</text>
<path d="M42 3888H1618" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="3915" text-anchor="start" font-size="15" class="label">[Fetch đã đọc JSON nhưng data.success không true]</text>
<path d="M42 4030H1618" stroke="#64748b" stroke-dasharray="7 5"/>
<text x="62" y="4057" text-anchor="start" font-size="15" class="label">[Fetch / đọc JSON / chuỗi then phát sinh lỗi]</text>
<rect x="85" y="210" width="1490" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="234" text-anchor="middle" font-size="16" class="">Bắt đầu khi checkout đã render: có phiên web và địa chỉ mặc định. Luồng sau giả định PayPal SDK đã tải và handler JavaScript đã đăng ký.</text>
<path d="M180 330H440" class="msg"/>
<text x="310.0" y="300" text-anchor="middle" font-size="16" class="label">1. Chọn PayPal; hiển thị nút</text>
<text x="310.0" y="321" text-anchor="middle" font-size="16" class="label">SDK</text>
<path d="M440 386h42v20h-42" class="msg"/>
<text x="495" y="377" text-anchor="start" font-size="16" class="label">2. Đọc tổng DOM / 24.000; toFixed(2)</text>
<path d="M440 483H700" class="msg"/>
<text x="570.0" y="453" text-anchor="middle" font-size="16" class="label">3. actions.order.create(purcha</text>
<text x="570.0" y="474" text-anchor="middle" font-size="16" class="label">se_units.amount.value)</text>
<path d="M700 539H440" class="msg" stroke-dasharray="6 4"/>
<text x="570.0" y="530" text-anchor="middle" font-size="16" class="label">4. Kết quả tạo order SDK</text>
<path d="M180 595H700" class="msg"/>
<text x="440.0" y="586" text-anchor="middle" font-size="16" class="label">5. Duyệt thanh toán tại PayPal</text>
<path d="M700 651H440" class="msg" stroke-dasharray="6 4"/>
<text x="570.0" y="642" text-anchor="middle" font-size="16" class="label">6. onApprove(data)</text>
<path d="M440 707H700" class="msg"/>
<text x="570.0" y="698" text-anchor="middle" font-size="16" class="label">7. actions.order.capture()</text>
<path d="M700 763H440" class="msg" stroke-dasharray="6 4"/>
<text x="570.0" y="754" text-anchor="middle" font-size="16" class="label">8. Promise resolve: details</text>
<rect x="85" y="792" width="1490" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="816" text-anchor="middle" font-size="16" class="">Không có onCancel/onError riêng. Hủy hoặc lỗi capture chưa có nhánh phục hồi do ứng dụng định nghĩa. POST dưới đây chỉ được gọi khi promise capture resolve.</text>
<rect x="30" y="864" width="1600" height="42" fill="#e8eff7" stroke="#94a3b8"/>
<text x="830.0" y="891" text-anchor="middle" font-size="19" class="">Ghi đơn sau capture ở frontend</text>
<rect x="85" y="929" width="1490" height="74" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="953" text-anchor="middle" font-size="16" class="">Frontend gửi orderID, payerID, transactionID=details.id, amount=details.purchase_units[0].amount.value, địa chỉ dropdown, payment_method=paypal. Backend không gọi API PayPal để xác</text>
<text x="830.0" y="974" text-anchor="middle" font-size="16" class="">minh.</text>
<path d="M440 1052H960" class="msg"/>
<text x="700.0" y="1043" text-anchor="middle" font-size="16" class="label">9. POST /checkout/paypal [placeOrderPaypal] + CSRF</text>
<path d="M960 1168H440" class="msg" stroke-dasharray="6 4"/>
<text x="700.0" y="1159" text-anchor="middle" font-size="16" class="label">10. 419 CSRF hoặc redirect /login (trước controller)</text>
<path d="M960 1331H1220" class="msg"/>
<text x="1090.0" y="1280" text-anchor="middle" font-size="16" class="label">11. /checkout/paypal</text>
<text x="1090.0" y="1301" text-anchor="middle" font-size="16" class="label">[placeOrderPaypal] → phương</text>
<text x="1090.0" y="1322" text-anchor="middle" font-size="16" class="label">thức controller</text>
<path d="M1220 1408h42v20h-42" class="msg"/>
<text x="1275" y="1378" text-anchor="start" font-size="16" class="label">12. Validate required / kiểu dữ</text>
<text x="1275" y="1399" text-anchor="start" font-size="16" class="label">liệu; address_id phải tồn tại</text>
<path d="M1220 1505H1480" class="msg"/>
<text x="1350.0" y="1475" text-anchor="middle" font-size="16" class="label">13. Kiểm tra address_id tồn</text>
<text x="1350.0" y="1496" text-anchor="middle" font-size="16" class="label">tại</text>
<path d="M1480 1561H1220" class="msg" stroke-dasharray="6 4"/>
<text x="1350.0" y="1552" text-anchor="middle" font-size="16" class="label">14. Kết quả tồn tại địa chỉ</text>
<path d="M1220 1677H440" class="msg" stroke-dasharray="6 4"/>
<text x="830.0" y="1668" text-anchor="middle" font-size="16" class="label">15. Laravel trả lỗi validation (form redirect / JSON 422)</text>
<path d="M1220 1819H1480" class="msg"/>
<text x="1350.0" y="1789" text-anchor="middle" font-size="16" class="label">16. Nạp CartItem theo Auth</text>
<text x="1350.0" y="1810" text-anchor="middle" font-size="16" class="label">user cùng product</text>
<path d="M1480 1896H1220" class="msg" stroke-dasharray="6 4"/>
<text x="1350.0" y="1866" text-anchor="middle" font-size="16" class="label">17. Các dòng giỏ và sản phẩm</text>
<text x="1350.0" y="1887" text-anchor="middle" font-size="16" class="label">hiện tại</text>
<path d="M1220 2012H440" class="msg" stroke-dasharray="6 4"/>
<text x="830.0" y="2003" text-anchor="middle" font-size="16" class="label">18. JSON success=false: Giỏ hàng trống</text>
<path d="M1220 2154H1480" class="msg"/>
<text x="1350.0" y="2124" text-anchor="middle" font-size="16" class="label">19. DB::beginTransaction() —</text>
<text x="1350.0" y="2145" text-anchor="middle" font-size="16" class="label">nằm ngoài try</text>
<path d="M1220 2291h42v20h-42" class="msg"/>
<text x="1275" y="2261" text-anchor="start" font-size="16" class="label">20. Tính tổng = request.amount ×</text>
<text x="1275" y="2282" text-anchor="start" font-size="16" class="label">25.000 + 25.000</text>
<path d="M1220 2409H1480" class="msg"/>
<text x="1350.0" y="2358" text-anchor="middle" font-size="16" class="label">21. Tạo Order: user,</text>
<text x="1350.0" y="2379" text-anchor="middle" font-size="16" class="label">address_id, total_price,</text>
<text x="1350.0" y="2400" text-anchor="middle" font-size="16" class="label">status=pending</text>
<path d="M1480 2486H1220" class="msg" stroke-dasharray="6 4"/>
<text x="1350.0" y="2456" text-anchor="middle" font-size="16" class="label">22. Order đã lưu trong</text>
<text x="1350.0" y="2477" text-anchor="middle" font-size="16" class="label">transaction</text>
<path d="M1220 2644H1480" class="msg"/>
<text x="1350.0" y="2593" text-anchor="middle" font-size="16" class="label">23. Tạo OrderItem: order,</text>
<text x="1350.0" y="2614" text-anchor="middle" font-size="16" class="label">product, quantity, giá hiện</text>
<text x="1350.0" y="2635" text-anchor="middle" font-size="16" class="label">tại</text>
<path d="M1220 2721h42v20h-42" class="msg"/>
<text x="1275" y="2691" text-anchor="start" font-size="16" class="label">24. Kiểm tra stock &lt; quantity; nếu</text>
<text x="1275" y="2712" text-anchor="start" font-size="16" class="label">thiếu thì throw Exception</text>
<rect x="85" y="2770" width="1490" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="2794" text-anchor="middle" font-size="16" class="">Tạo OrderItem TRƯỚC kiểm tra tồn. Nếu throw Exception ở đây, dừng khối try và chạy nhánh catch bên dưới; không tiếp tục tạo Payment.</text>
<path d="M1220 2890H1480" class="msg"/>
<text x="1350.0" y="2860" text-anchor="middle" font-size="16" class="label">25. decrement stock theo</text>
<text x="1350.0" y="2881" text-anchor="middle" font-size="16" class="label">quantity — khi không thiếu tồn</text>
<path d="M1220 3044H1480" class="msg"/>
<text x="1350.0" y="2972" text-anchor="middle" font-size="16" class="label">26. Tạo Payment</text>
<text x="1350.0" y="2993" text-anchor="middle" font-size="16" class="label">paypal/completed; amount=tổng</text>
<text x="1350.0" y="3014" text-anchor="middle" font-size="16" class="label">đơn; paid_at=now; transaction_</text>
<text x="1350.0" y="3035" text-anchor="middle" font-size="16" class="label">id=request.transactionID</text>
<path d="M1220 3121H1480" class="msg"/>
<text x="1350.0" y="3091" text-anchor="middle" font-size="16" class="label">27. Xóa toàn bộ CartItem theo</text>
<text x="1350.0" y="3112" text-anchor="middle" font-size="16" class="label">user_id</text>
<path d="M1220 3177H1480" class="msg"/>
<text x="1350.0" y="3168" text-anchor="middle" font-size="16" class="label">28. DB::commit()</text>
<path d="M1220 3233H440" class="msg" stroke-dasharray="6 4"/>
<text x="830.0" y="3224" text-anchor="middle" font-size="16" class="label">29. JSON success=true</text>
<path d="M1220 3354h42v20h-42" class="msg"/>
<text x="1275" y="3345" text-anchor="start" font-size="16" class="label">30. Log::error thông điệp lỗi</text>
<path d="M1220 3430H1480" class="msg"/>
<text x="1350.0" y="3421" text-anchor="middle" font-size="16" class="label">31. DB::rollBack()</text>
<path d="M1220 3486H440" class="msg" stroke-dasharray="6 4"/>
<text x="830.0" y="3477" text-anchor="middle" font-size="16" class="label">32. JSON success=false: Đặt hàng PayPal thất bại</text>
<rect x="85" y="3515" width="1490" height="74" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="3539" text-anchor="middle" font-size="16" class="">Nhánh catch thay thế phần còn lại sau bước ném Exception, không chạy sau một luồng thành công. PHP Error không được catch(Exception) này bắt. Rollback không hoàn tác được dữ liệu đã</text>
<text x="830.0" y="3560" text-anchor="middle" font-size="16" class="">commit nếu lỗi xảy ra sau commit.</text>
<path d="M440 3859H180" class="msg" stroke-dasharray="6 4"/>
<text x="310.0" y="3829" text-anchor="middle" font-size="16" class="label">33. Toast thành công; chuyển</text>
<text x="310.0" y="3850" text-anchor="middle" font-size="16" class="label">/account</text>
<path d="M440 4001H180" class="msg" stroke-dasharray="6 4"/>
<text x="310.0" y="3971" text-anchor="middle" font-size="16" class="label">34. Toast data.message hoặc</text>
<text x="310.0" y="3992" text-anchor="middle" font-size="16" class="label">lỗi mặc định; giữ trang</text>
<path d="M440 4122h42v20h-42" class="msg"/>
<text x="495" y="4113" text-anchor="start" font-size="16" class="label">35. console.error; toast lỗi kết nối</text>
<rect x="85" y="4206" width="1490" height="50" rx="6" fill="#fff8e8" stroke="#d6b567"/>
<text x="830.0" y="4230" text-anchor="middle" font-size="16" class="">Nếu middleware/validation trả redirect hoặc HTML, response.json() có thể lỗi. Nhánh UI dựa kết quả fetch thực tế; không suy ra capture đã được hoàn tiền khi backend thất bại.</text>
<text x="830.0" y="4358" text-anchor="middle" font-size="15" class="">Vinmark • Sơ đồ tương tác AS-IS theo mã nguồn • Không bổ sung bước To-Be</text>
</svg>