<rect width="1660" height="4378" fill="white"/>
<text x="830.0" y="38" text-anchor="middle" font-size="26" class="">SEQUENCE — THANH TOÁN PAYPAL • AS-IS</text>
<text x="830.0" y="75" text-anchor="middle" font-size="16" class="">AS-IS • Đường đứt: phản hồi • alt: nhánh loại trừ • loop: lặp tuần tự • Đọc từ trên xuống</text>
